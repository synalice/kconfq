name: Project's CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  build-kconfq:
    strategy:
      matrix:
        include:
        - arch: x86_64-linux
          os: ubuntu-24.04
        - arch: aarch64-linux
          os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: "build kconfq: ${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Build $out output
        run: |
          nix build .#packages.${{ matrix.arch }}.default
          tree result

      - name: Build $dev output
        run: |
          nix build .#packages.${{ matrix.arch }}.default.dev
          tree result-dev

  build-libkconfq:
    strategy:
      matrix:
        include:
        - arch: x86_64-linux
          os: ubuntu-24.04
        - arch: aarch64-linux
          os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: "build libkconfq: ${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Meson setup
        run: meson setup builddir/

      - name: Meson compile
        run: meson compile -C builddir/

      - name: Meson install
        run: meson install -C builddir/ --destdir ../installroot

      - name: Tree isntallroot/
        run: tree installroot/

  run-pre-commit-hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Configure build
        run: meson setup builddir/

      - name: Run pre-commit hooks
        run: prek run --all-files
