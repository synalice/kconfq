name: Project's CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  native-build-kconfq-cargo:
    name: "kconfq native build (via Cargo): ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04

          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Run `cargo build`
        run: RUSTFLAGS="-Dwarnings" cargo build

  native-build-kconfq-nix:
    name: "kconfq native build (via Nix): ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04

          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Build kconfq
        run: |
          nix build .#packages.${{ matrix.arch }}.kconfq
          tree result

  native-build-libkconfq-meson:
    name: "libkconfq native build (via Meson): ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04

          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Meson setup
        run: meson setup builddir/

      - name: Meson compile
        run: meson compile -C builddir/

      - name: Meson install
        run: meson install -C builddir/ --destdir ../installroot

      - name: Tree installroot
        run: tree installroot/

  native-build-libkconfq-nix:
    name: "libkconfq native build (via Nix): ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04

          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Build libkconfq $out
        run: |
          nix build .#packages.${{ matrix.arch }}.libkconfq.out
          tree result/

      - name: Build libkconfq $dev
        run: |
          nix build .#packages.${{ matrix.arch }}.libkconfq.dev
          tree result-dev/

  cross-compile-kconfq:
    name: "kconfq cross-compiled to aarch64"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Cross-compile $out
        run: |
          ./scripts/cross-compile.sh aarch64-multiplatform ./nix/kconfq.nix out
          tree result/

  cross-compile-libkconfq:
    name: "libkconfq cross-compiled to aarch64"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Cross-compile $out
        run: |
          ./scripts/cross-compile.sh aarch64-multiplatform ./nix/libkconfq.nix out
          tree result/

      - name: Cross-compile $dev
        run: |
          ./scripts/cross-compile.sh aarch64-multiplatform ./nix/libkconfq.nix dev
          tree result-dev/

  build-docs:
    name: "build documentation"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Run `cargo doc`
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc

  run-pre-commit-hooks:
    name: run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Configure build
        run: meson setup builddir/

      - name: Run pre-commit hooks
        run: prek run --all-files
