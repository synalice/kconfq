name: Project's CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  build-kconfq:
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04
          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: "build kconfq: ${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Build
        run: |
          nix build .#packages.${{ matrix.arch }}.default
          tree result

  build-libkconfq-meson:
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04
          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: "build libkconfq (with meson): ${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Meson setup
        run: meson setup builddir/

      - name: Meson compile
        run: meson compile -C builddir/

      - name: Meson install
        run: meson install -C builddir/ --destdir ../installroot

      - name: Tree isntallroot/
        run: tree installroot/

  build-libkconfq-nix:
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            os: ubuntu-24.04
          - arch: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: "build libkconfq (with nix): ${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Build $out
        run: |
          nix build .#libkconfq.out
          tree result/

      - name: Build $dev
        run: |
          nix build .#libkconfq.dev
          tree result-dev/

  cross-compile-libkconfq:
    runs-on: ubuntu-24.04
    name: "cross-compile libkconfq: x86_64-linux -> aarch64-linux"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Cross-compile $out
        run: |
          ./scripts/cross-compile.sh aarch64-multiplatform ./nix/libkconfq.nix out
          tree result/

      - name: Cross-compile $dev
        run: |
          ./scripts/cross-compile.sh aarch64-multiplatform ./nix/libkconfq.nix dev
          tree result-dev/

  run-pre-commit-hooks:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/nix-setup

      - name: Configure build
        run: meson setup builddir/

      - name: Run pre-commit hooks
        run: prek run --all-files
